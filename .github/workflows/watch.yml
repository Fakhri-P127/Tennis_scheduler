name: tennis-watch

on:
  schedule:
    # every 5 min. GitHub's scheduler is best-effort — expect real gaps of 5-15 min.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal | dump | reset"
        required: false
        default: "normal"

concurrency:
  group: tennis-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check availability
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HOUR_FROM: "18"
          HOUR_TO: "22"
          DAYS_AHEAD: "14"
        run: |
          case "${{ github.event.inputs.mode }}" in
            dump)  python tennis_watch.py --dump ;;
            reset) python tennis_watch.py --reset ;;
            *)     python tennis_watch.py ;;
          esac

      - name: Persist state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "tennis-watch"
            git config user.email "actions@github.com"
            git add state.json
            git commit -m "state: $(date -u +%FT%TZ)"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="⚠️ tennis-watch run failed — check the Actions log." >/dev/null
